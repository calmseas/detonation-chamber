[project]
name = "detonation-chamber"
version = "0.1.0"
description = "Containment and review for installable prompt artefacts — skills, MCP servers, rule files, tool descriptions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chamber = "chamber.cli:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = "chamber"
