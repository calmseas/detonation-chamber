name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --with-editable . --with pytest pytest -q

  # The runtime half. `chamber scan` is the static layer; `runtime/` is the
  # behavioural one.
  #
  # These are the container-free levels: everything that can be proved without
  # a Linux guest. The containment suite is the `containment` job below, and it
  # FAILS rather than skips when Docker is absent -- a suite that no-ops
  # without a guest makes a green tick mean nothing.
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      # Only needs to put rustup on the runner. Which toolchain, and which
      # components, come from runtime/rust-toolchain.toml — naming them here
      # too would install them onto `stable` rather than onto the pinned
      # version cargo actually resolves to.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # chamber-e2e is excluded by NAME rather than by a runtime skip, which is
      # what makes "the no-Docker suite" something you can actually name and
      # run rather than something that quietly shrinks when a tool is missing.
      - run: cargo test --workspace --exclude chamber-e2e
      # ...except this one, which lives in chamber-e2e because it guards the
      # containment work, but is a source scan and needs no engine at all.
      - run: cargo test -p chamber-e2e --test no_flush_ruleset
      # The exec-relay's C unit tests (its JSON value parser and config loader)
      # are pure logic over portable C and need no Linux guest — only a C
      # compiler, which ubuntu-latest ships (`cc`). They compile the very
      # sources the guest image builds, so a parser regression is caught here
      # rather than only surfacing inside a Docker build no CI job ran.
      - name: exec-relay C unit tests
        run: images/guest-exec-relay/tests/run_c_tests.sh

  # The container gate.
  #
  # This job must FAIL rather than skip when Docker is absent, which is what
  # CHAMBER_REQUIRE_CONTAINERS flips on. No `continue-on-error`, deliberately:
  # a containment result that can silently not-run is not a result.
  containment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    env:
      CHAMBER_REQUIRE_CONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      # The unarmed positive control needs real egress. Rows 1, 2, 4 and 11
      # keep their armed targets (8.8.8.8, 1.1.1.1) precisely so a typo'd
      # destination cannot pass as containment -- which means the baseline run
      # has to be able to reach them. If this job ever fails on those rows
      # alone, suspect the runner's network before suspecting the chamber.
      #
      # No --test-threads=1: the tests that need the chamber's fixed subnet
      # serialise themselves in-process. Doing it with a CLI flag here would
      # leave a plain `cargo test` broken for anyone running it locally.
      - run: cargo test -p chamber-e2e --test containment

  # The exec-consequence gate: the ptrace+seccomp exec-interception relay, end
  # to end against the real read-only cell spec. Same container gate as
  # containment (FAIL, not skip, when Docker is absent; no `continue-on-error`).
  # Its own job rather than a step folded into `containment` because it builds a
  # separate guest image (guest-exec-relay) and its failures are about a
  # different mechanism -- a red here means the interception layer is broken,
  # not that egress containment is. Without this job the whole exec_consequence
  # suite ran in no CI at all.
  exec-consequence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    env:
      CHAMBER_REQUIRE_CONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      # Same subnet-serialisation note as containment: the tests raise the
      # chamber's fixed subnet and serialise themselves in-process, so no
      # --test-threads=1 here either.
      - run: cargo test -p chamber-e2e --test exec_consequence

  # The fixture matrix: the whole tool, end to end. Rows 2-5 are the
  # anti-rubber-stamp tests and none may be #[ignore]d. Same container gate as
  # containment (FAIL, not skip, when Docker is absent) and no
  # `continue-on-error`. It ALSO needs uv, because two of its rows tie the
  # runtime half back to the static `chamber scan` over the fixtures.
  detonation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    env:
      CHAMBER_REQUIRE_CONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      # The cross-layer rows shell out to `uv run chamber scan` from the repo
      # root, so the scanner has to be on PATH here too. Its absence is a test
      # failure under CHAMBER_REQUIRE_CONTAINERS, not a silent skip.
      - uses: astral-sh/setup-uv@v5
      - run: cargo test -p chamber-e2e --test matrix

  # The tool must survive being pointed at itself. A legibility checker that
  # cannot pass its own check has no business gating anyone else's artefacts.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: chamber scan its own shipped source
        # Scan the git-archived form -- exactly what ships, with none of the
        # .pyc build artefacts `uv run` generates in the working tree (a
        # committed .pyc correctly FAILs, so scanning the dirty tree is wrong).
        # FLAG (exit 1) is acceptable: rules.py exceeds the review window and
        # carries a deliberate Cyrillic homoglyph documenting the R5 attack.
        run: |
          mkdir -p /tmp/shipped
          git archive HEAD src | tar -x -C /tmp/shipped
          # `|| status=$?` keeps the step's `set -e` from aborting on the
          # tool's own non-zero exit (1 = FLAG is acceptable here).
          uv run --with-editable . chamber scan /tmp/shipped/src && status=0 || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::chamber scan reported FAIL on its own shipped source"
            exit 1
          fi
          echo "chamber scan: exit $status (0=pass, 1=flag, both acceptable)"

  # Nothing scanned the dependency closure until now. `runtime/deny.toml` denies
  # a second major of anything (the TLS/HTTP/DNS/cert stack has none, and this
  # keeps it so) and, via the advisories check, hard-fails on a known-vulnerable
  # dependency -- the hickory 0.26.0 DoS advisories being the concrete reason.
  # The graph in deny.toml is pinned to this runner's target so the result here
  # matches a developer's local `cargo deny`.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: runtime/Cargo.toml
          command: check advisories bans
