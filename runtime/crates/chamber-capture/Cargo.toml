[package]
name = "chamber-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The boundary observer: canary matching, and (later slices) the intercepting proxy and DNS sink."

[dependencies]
chamber-evidence = { path = "../chamber-evidence" }
data-encoding = "2"
percent-encoding = "2"
hex = "0.4"
hickory-server = "0.26"
hickory-proto = "0.26"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
chamber-deadline = { version = "0.1.0", path = "../chamber-deadline" }
async-trait = "0.1.92"
