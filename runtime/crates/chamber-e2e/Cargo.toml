[package]
name = "chamber-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The container gate: the containment probe suite and the fixture matrix. Tests only."

# No lib and no bin target, deliberately: nothing can accidentally depend on
# this crate, which is what makes `cargo test --workspace --exclude chamber-e2e`
# a reliable name for the suite that needs no Linux guest. The test targets are
# declared explicitly because a package with no `src/` has no target otherwise.
[[test]]
name = "containment"
path = "tests/containment.rs"

[[test]]
name = "no_flush_ruleset"
path = "tests/no_flush_ruleset.rs"

[[test]]
name = "matrix"
path = "tests/matrix.rs"

[[test]]
name = "exec_consequence"
path = "tests/exec_consequence.rs"

[dev-dependencies]
# The supervisor's judge trait is async, so a scripted judge in a test needs the
# same macro the trait was declared with.
async-trait = "0.1.92"
chamber-isolation = { path = "../chamber-isolation" }
chamber-run = { path = "../chamber-run" }
chamber-evidence = { path = "../chamber-evidence" }
# default-features = false: this test only needs ExecConsequencePlan and its
# rule/verb types, not the observer feature's proxy/DNS stack — same reasoning
# as chamber-run's own dependency on this crate.
chamber-capture = { path = "../chamber-capture", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
