[package]
name = "chamber-evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Evidence bundle for a detonation run: run identity, observation ledger, coverage map, and a verdict that is derived rather than asserted."

[dependencies]
